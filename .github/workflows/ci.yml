# Runs the whole test suite (database, unit, integration, Playwright) on every push and pull request.
# Fails if a test fails or coverage drops below 70% (see pyproject.toml).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same throwaway PostgreSQL as docker-compose.test.yml, on the port confighub/test_settings.py expects.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: confighub
          POSTGRES_USER: confighub
          POSTGRES_PASSWORD: test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U confighub -d confighub"
          --health-interval 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests with coverage
        run: python -m pytest
