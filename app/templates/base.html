{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ConfigHub{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'style.css' %}" rel="stylesheet"></head><body><nav class="navbar bg-dark"><div class="container"><a class="text-white" href="{% url 'dashboard' %}">ConfigHub</a><a class="text-white" href="{% url 'admin:index' %}">Admin</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form></div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
