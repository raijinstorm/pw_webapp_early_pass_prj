{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">
    {% if not user.is_authenticated %}<div class="text-center mb-4 mt-md-4"><span class="brand-mark"><i class="bi bi-sliders2"></i></span><div class="h4 mt-2 mb-0">ConfigHub</div></div>{% endif %}
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Sign in</h1>
        <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
          {% include "app/partials/form_fields.html" %}
          <button class="btn btn-primary w-100">Sign in</button>
        </form>
        <div class="text-center mt-3"><a href="{% url 'password_reset' %}" class="small">Forgot your password?</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
