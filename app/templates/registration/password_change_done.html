{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">
    {% if not user.is_authenticated %}<div class="text-center mb-4 mt-md-4"><span class="brand-mark"><i class="bi bi-sliders2"></i></span><div class="h4 mt-2 mb-0">ConfigHub</div></div>{% endif %}
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Password changed</h1>
        <p class="mb-3">Your password has been changed.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary w-100">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
